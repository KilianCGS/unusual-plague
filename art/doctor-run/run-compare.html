const root=document.getElementById('r');const items=[];
for(const [n,arr] of Object.entries(SETS)){const d=document.createElement('div');d.className='c';d.innerHTML='<div>'+n+'</div>';
 const c=document.createElement('canvas');c.width=W*S;c.height=H*S;d.appendChild(c);root.appendChild(d);
 items.push({c,x:c.getContext('2d'),imgs:arr.map(s=>{const i=new Image();i.src='data:image/png;base64,'+s;return i})})}
let k=0,last=0;
function draw(){const gl=document.getElementById('g').checked;for(const it of items){const x=it.x;x.imageSmoothingEnabled=false;x.fillStyle='#78905a';x.fillRect(0,0,W*S,H*S);
 if(gl){x.fillStyle='rgba(0,0,0,.25)';x.fillRect(0,(84-8)*S,W*S,2)}
 x.drawImage(it.imgs[k%8],0,0,W*S,H*S)}}
function loop(t){const ms=+document.getElementById('f').value;document.getElementById('v').textContent=ms;if(t-last>ms){last=t;k++;draw()}requestAnimationFrame(loop)}
Promise.all(items.flatMap(i=>i.imgs).map(i=>new Promise(r=>i.onload=r))).then(()=>{draw();requestAnimationFrame(loop)});
</script>
